name: Sync upstream develop (mirror-safe)

on:
  workflow_dispatch: {}        # allow manual runs
  schedule:
    - cron: "17 6 * * *"       # daily at 06:17 UTC (change as you like)

permissions:
  contents: write              # needed to push to your fork

env:
  UPSTREAM_REPO: SparkDevNetwork/Rock
  BRANCH: develop

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
          fetch-tags: true

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream --prune --tags
          git checkout ${{ env.BRANCH }}

      - name: Sync branch to upstream (FF if possible, else hard reset)
        run: |
          set -euxo pipefail
          # Ensure upstream branch exists
          git ls-remote --heads upstream ${{ env.BRANCH }}

          # Try fast-forward first
          if git merge-base --is-ancestor HEAD "upstream/${{ env.BRANCH }}"; then
            git merge --ff-only "upstream/${{ env.BRANCH }}"
          else
            # Histories diverged: mirror upstream exactly
            git reset --hard "upstream/${{ env.BRANCH }}"
          fi

      - name: Push branch (force-with-lease) and tags
        run: |
          set -euxo pipefail
          # Push branch (safe force for mirrors)
          git push --force-with-lease origin "${{ env.BRANCH }}"
          # Push tags
          git push origin --tags
