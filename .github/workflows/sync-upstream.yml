name: Sync upstream develop (ff-only) + tags

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC

permissions:
  contents: write

env:
  UPSTREAM_REPO: SparkDevNetwork/Rock
  BRANCH: develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream --prune --tags
          git checkout ${{ env.BRANCH }}

      - name: Fast-forward from upstream (fail if not possible)
        run: |
          set -euxo pipefail
          # Ensure upstream branch exists
          git ls-remote --heads upstream ${{ env.BRANCH }}
          # Try ff-only merge
          git merge --ff-only "upstream/${{ env.BRANCH }}" || { echo "Not fast-forwardable"; exit 0; }

      - name: Push branch if ahead
        run: |
          set -euxo pipefail
          AHEAD=$(git rev-list --left-right --count "origin/${{ env.BRANCH }}...HEAD" | awk '{print $1}')
          if [ "${AHEAD:-0}" -gt 0 ]; then
            git push origin "${{ env.BRANCH }}"
          else
            echo "Already up to date."
          fi

      - name: Push tags
        run: git push origin --tags
